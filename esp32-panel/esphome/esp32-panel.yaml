# Pannello touch ESP32 multi-pagina — Elecrow CrowPanel 7" (DIS08070H)
#
# Funziona DA SOLO: non serve Home Assistant né altri server. Si controlla
# dallo schermo e dal browser (http://pannello-esp32.local). Home Assistant
# e MQTT sono moduli facoltativi in fondo all'elenco `packages`.
#
# Prima installazione (via USB):   esphome run esp32-panel.yaml
# Aggiornamenti successivi:        via WiFi (OTA), stesso comando
# Segreti in secrets.yaml (vedi secrets.yaml.example), mai nel repository.

substitutions:
  name: pannello-esp32
  friendly_name: Pannello ESP32
  timezone: Europe/Rome

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.7.0

packages:
  # --- Scheda: scegli la riga della tua revisione (stampata sul retro) ----
  hardware: !include hardware/crowpanel-7-v3.yaml
  # hardware: !include hardware/crowpanel-7-v1v2.yaml

  # --- Pagine, nell'ordine in cui scorrono. Commenta una riga per toglierla
  page_home: !include pages/home.yaml
  page_timer: !include pages/timer.yaml
  page_webcam: !include
    file: pages/immagini.yaml
    vars:
      p: webcam
      titolo: Webcam
      aggiorna: 10min
      # webcam di montagna: "Nome|URL diretto dell'immagine", una per riga
      elenco: |-
        {
          "Webcam 1|https://www.example.com/webcam1.jpg",
          "Webcam 2|https://www.example.com/webcam2.jpg",
        }
  page_telecamere: !include
    file: pages/immagini.yaml
    vars:
      p: telecamere
      titolo: Telecamere
      aggiorna: 3s
      # telecamere di casa (contengono password): l'elenco sta in
      # secrets.yaml alla voce `telecamere`, generato da
      # tools/trova-telecamere.py
      elenco: !secret telecamere
  page_uscite: !include pages/uscite.yaml
  page_sensori: !include pages/sensori.yaml
  page_impostazioni: !include pages/impostazioni.yaml

  # --- Funzioni (sopra tutte le pagine) -----------------------------------
  salvaschermo: !include funzioni/salvaschermo.yaml

  # --- Integrazioni facoltative --------------------------------------------
  # homeassistant: !include integrations/homeassistant.yaml
  # mqtt: !include integrations/mqtt.yaml

logger:
  # la porta USB della scheda passa da un convertitore CH340 su UART0
  # (GPIO43/44): i GPIO19/20 della USB nativa sono usati per l'I2C
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # senza WiFi il pannello crea una sua rete per riconfigurarlo
  ap:
    ssid: "Pannello-ESP32"
    password: !secret ap_password
  on_connect:
    - lvgl.label.update:
        id: nav_wifi
        text_color: 0x00E5FF
  on_disconnect:
    - lvgl.label.update:
        id: nav_wifi
        text_color: 0x3D5A80

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

# interfaccia web locale: tutte le entità (luce schermo, uscite, timer,
# messaggio...) sono comandabili dal browser senza altri programmi
web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: admin
    password: !secret web_password

time:
  - platform: sntp
    id: orologio
    timezone: ${timezone}
    on_time_sync:
      - script.execute: aggiorna_orologio
    on_time:
      - seconds: 0
        then:
          - script.execute: aggiorna_orologio

interval:
  - interval: 10s
    then:
      - script.execute: aggiorna_orologio

# --- Font -------------------------------------------------------------------
# Roboto da Google Fonts (scaricato alla compilazione) per avere gli
# accenti italiani; le icone dei pulsanti usano i simboli integrati in LVGL
# (font montserrat_*), che invece non hanno lettere accentate.
font:
  - file: "gfonts://Roboto"
    id: font_testo
    size: 24
    bpp: 4  # bordi sfumati (antialiasing)
    glyphsets: [GF_Latin_Kernel]
    glyphs: "àèéìòùÀÈÉÌÒÙ°·€"
  - file: "gfonts://Roboto@500"
    id: font_titolo
    size: 32
    bpp: 4  # bordi sfumati (antialiasing)
    glyphsets: [GF_Latin_Kernel]
    glyphs: "àèéìòùÀÈÉÌÒÙ°·€"
  - file: "gfonts://Roboto@500"
    id: font_grande
    size: 72
    bpp: 4  # bordi sfumati (antialiasing)
    glyphs: "0123456789:.,-+°%CmhPa "
  - file: "gfonts://Roboto@500"
    id: font_medio
    size: 40
    bpp: 4  # bordi sfumati (antialiasing)
    glyphs: "0123456789:.,-+°%CmhPagdB "
  - file: "gfonts://Roboto@300"
    id: font_orologio
    size: 180
    bpp: 4  # bordi sfumati (antialiasing)
    glyphs: "0123456789:-"

# --- Impostazioni comuni a tutte le pagine ----------------------------------
number:
  - platform: template
    id: spegnimento_schermo
    name: "Spegnimento schermo dopo"
    icon: mdi:timer-sand
    unit_of_measurement: s
    min_value: 0
    max_value: 3600
    step: 10
    initial_value: 900
    optimistic: true
    restore_value: true
    entity_category: config

text:
  # Scrivi qui (da browser, Home Assistant, MQTT o da un'altra pagina) e il
  # testo compare in un riquadro sopra qualunque pagina, riaccendendo lo
  # schermo. Utile per avvisi: campanello, lavatrice finita, timer...
  - platform: template
    id: messaggio
    name: "Messaggio"
    icon: mdi:message-alert
    mode: text
    max_length: 200
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: "return !x.empty();"
          then:
            - lvgl.label.update:
                id: msg_testo
                text: !lambda "return x;"
            - lvgl.widget.show: msg_box
            - script.execute: sveglia_schermo

script:
  - id: sveglia_schermo
    then:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - light.turn_on: backlight

  - id: aggiorna_orologio
    then:
      - lvgl.label.update:
          id: nav_ora
          text: !lambda |-
            auto t = id(orologio).now();
            if (!t.is_valid()) return std::string("--:--");
            return t.strftime("%H:%M");

touchscreen:
  - id: !extend touch
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - script.execute: sveglia_schermo

# --- Interfaccia grafica -----------------------------------------------------
lvgl:
  displays: [lcd]
  touchscreens: [touch]
  buffer_size: 25%
  default_font: font_testo
  page_wrap: true
  # --- Tema blu ---------------------------------------------------------
  # Palette: blu notte (sfondo) → blu reale (pulsanti) → azzurro/ciano
  # (accenti e stati attivi). Cambiando questi colori cambia tutto il
  # pannello; le pagine usano gli stili qui sotto.
  bg_color: 0x0A1F4D
  bg_grad_color: 0x020A1E
  bg_grad_dir: VER
  bg_opa: COVER
  text_color: 0xFFFFFF
  style_definitions:
    - id: st_titolo
      text_font: font_titolo
      text_color: 0x80D8FF
    - id: st_tenue
      text_color: 0x90CAF9
    - id: st_riquadro
      bg_color: 0x1A4A9C
      bg_grad_color: 0x0D2A63
      bg_grad_dir: VER
      bg_opa: COVER
      border_width: 1
      border_color: 0x42A5F5
      border_opa: 60%
      radius: 20
      pad_all: 16
      shadow_width: 18
      shadow_color: 0x000814
      shadow_opa: 70%
      shadow_ofs_y: 6
    - id: st_pulsante_nav
      bg_color: 0x1565C0
      bg_grad_color: 0x0D47A1
      bg_grad_dir: VER
      border_width: 1
      border_color: 0x64B5F6
      border_opa: 50%
      shadow_width: 0
  theme:
    label:
      text_color: 0xFFFFFF
    button:
      bg_color: 0x2196F3
      bg_grad_color: 0x1257B0
      bg_grad_dir: VER
      bg_opa: COVER
      radius: 16
      text_color: 0xFFFFFF
      border_width: 1
      border_color: 0x90CAF9
      border_opa: 40%
      shadow_width: 14
      shadow_color: 0x00102E
      shadow_opa: 80%
      shadow_ofs_y: 5
      pressed:
        bg_color: 0x0D47A1
        bg_grad_color: 0x08306B
        shadow_ofs_y: 1
      checked:
        bg_color: 0x00E5FF
        bg_grad_color: 0x0091EA
        text_color: 0x002050
        border_color: 0xE0F7FA
        shadow_color: 0x00E5FF
        shadow_opa: 60%
        shadow_width: 24
        shadow_ofs_y: 0
    slider:
      bg_color: 0x0D2A63
      bg_opa: COVER
      radius: 15
      indicator:
        bg_color: 0x0091EA
        bg_grad_color: 0x00E5FF
        bg_grad_dir: HOR
        radius: 15
      knob:
        bg_color: 0xFFFFFF
        border_width: 4
        border_color: 0x00B0FF
        shadow_width: 12
        shadow_color: 0x00E5FF
        shadow_opa: 50%
    switch:
      indicator:
        checked:
          bg_color: 0x00B0FF

  # schermo spento dopo N secondi senza tocchi (0 = mai); un tocco lo
  # riaccende senza attivare il pulsante sotto il dito
  # (è un elenco: funzioni/salvaschermo.yaml aggiunge il suo tempo)
  on_idle:
    - timeout: !lambda |-
        float s = id(spegnimento_schermo).state;
        return (s > 0 ? s : 86400) * 1000;
      then:
        - if:
            condition:
              lambda: "return id(spegnimento_schermo).state > 0;"
            then:
              - light.turn_off: backlight
              - lvgl.pause:

  # Barra di navigazione fissa in basso + riquadro messaggi: stanno nel
  # "top layer", quindi restano visibili su ogni pagina. Le pagine
  # occupano l'area sopra la barra (480 - 64 = 416 px di altezza utile).
  top_layer:
    widgets:
      - obj:
          id: nav_bar
          align: BOTTOM_MID
          width: 100%
          height: 64
          radius: 0
          bg_color: 0x0D3B8C
          bg_grad_color: 0x061A44
          bg_grad_dir: VER
          bg_opa: COVER
          border_width: 2
          border_side: TOP
          border_color: 0x29B6F6
          pad_all: 6
          widgets:
            - label:
                id: nav_ora
                align: LEFT_MID
                x: 12
                text: "--:--"
                text_font: font_titolo
                text_color: 0x80D8FF
            - button:
                align: CENTER
                x: -150
                width: 120
                height: 50
                styles: st_pulsante_nav
                on_click:
                  - lvgl.page.previous:
                widgets:
                  - label:
                      align: CENTER
                      text: ""
                      text_font: montserrat_28
            - button:
                align: CENTER
                width: 120
                height: 50
                styles: st_pulsante_nav
                on_click:
                  - lvgl.page.show: page_home
                widgets:
                  - label:
                      align: CENTER
                      text: ""
                      text_font: montserrat_28
            - button:
                align: CENTER
                x: 150
                width: 120
                height: 50
                styles: st_pulsante_nav
                on_click:
                  - lvgl.page.next:
                widgets:
                  - label:
                      align: CENTER
                      text: ""
                      text_font: montserrat_28
            - label:
                id: nav_wifi
                align: RIGHT_MID
                x: -12
                text: ""
                text_font: montserrat_28
                text_color: 0x3D5A80

      - obj:
          id: msg_box
          hidden: true
          align: CENTER
          y: -32
          width: 640
          height: 300
          bg_color: 0x1565C0
          bg_grad_color: 0x0A2A6B
          bg_grad_dir: VER
          bg_opa: COVER
          border_color: 0x00E5FF
          border_width: 3
          radius: 24
          shadow_width: 40
          shadow_color: 0x00B0FF
          shadow_opa: 50%
          pad_all: 20
          widgets:
            - label:
                align: TOP_LEFT
                text: "Messaggio"
                styles: st_titolo
                text_color: 0x00E5FF
            - label:
                id: msg_testo
                align: LEFT_MID
                width: 100%
                long_mode: WRAP
                text: ""
            - button:
                align: BOTTOM_RIGHT
                width: 160
                height: 56
                on_click:
                  - lvgl.widget.hide: msg_box
                  - text.set:
                      id: messaggio
                      value: ""
                widgets:
                  - label:
                      align: CENTER
                      text: "OK"
