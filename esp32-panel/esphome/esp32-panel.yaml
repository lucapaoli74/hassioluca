# Pannello touch ESP32 multi-pagina — Elecrow CrowPanel 7" (DIS08070H)
#
# Funziona DA SOLO: non serve Home Assistant né altri server. Si controlla
# dallo schermo e dal browser (http://pannello-esp32.local). Home Assistant
# e MQTT sono moduli facoltativi in fondo all'elenco `packages`.
#
# Prima installazione (via USB):   esphome run esp32-panel.yaml
# Aggiornamenti successivi:        via WiFi (OTA), stesso comando
# Segreti in secrets.yaml (vedi secrets.yaml.example), mai nel repository.

substitutions:
  name: pannello-esp32
  friendly_name: Pannello ESP32
  timezone: Europe/Rome

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.7.0

packages:
  # --- Scheda: scegli la riga della tua revisione (stampata sul retro) ----
  hardware: !include hardware/crowpanel-7-v3.yaml
  # hardware: !include hardware/crowpanel-7-v1v2.yaml

  # --- Pagine, nell'ordine in cui scorrono. Commenta una riga per toglierla
  page_home: !include pages/home.yaml
  page_timer: !include pages/timer.yaml
  page_uscite: !include pages/uscite.yaml
  page_sensori: !include pages/sensori.yaml
  page_impostazioni: !include pages/impostazioni.yaml

  # --- Integrazioni facoltative --------------------------------------------
  # homeassistant: !include integrations/homeassistant.yaml
  # mqtt: !include integrations/mqtt.yaml

logger:
  # la porta USB della scheda passa da un convertitore CH340 su UART0
  # (GPIO43/44): i GPIO19/20 della USB nativa sono usati per l'I2C
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # senza WiFi il pannello crea una sua rete per riconfigurarlo
  ap:
    ssid: "Pannello-ESP32"
    password: !secret ap_password
  on_connect:
    - lvgl.label.update:
        id: nav_wifi
        text_color: 0xFFFFFF
  on_disconnect:
    - lvgl.label.update:
        id: nav_wifi
        text_color: 0x555555

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

# interfaccia web locale: tutte le entità (luce schermo, uscite, timer,
# messaggio...) sono comandabili dal browser senza altri programmi
web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: admin
    password: !secret web_password

time:
  - platform: sntp
    id: orologio
    timezone: ${timezone}
    on_time_sync:
      - script.execute: aggiorna_orologio
    on_time:
      - seconds: 0
        then:
          - script.execute: aggiorna_orologio

# --- Font -------------------------------------------------------------------
# Roboto da Google Fonts (scaricato alla compilazione) per avere gli
# accenti italiani; le icone dei pulsanti usano i simboli integrati in LVGL
# (font montserrat_*), che invece non hanno lettere accentate.
font:
  - file: "gfonts://Roboto"
    id: font_testo
    size: 24
    glyphsets: [GF_Latin_Kernel]
    glyphs: "àèéìòùÀÈÉÌÒÙ°·€"
  - file: "gfonts://Roboto@500"
    id: font_titolo
    size: 32
    glyphsets: [GF_Latin_Kernel]
    glyphs: "àèéìòùÀÈÉÌÒÙ°·€"
  - file: "gfonts://Roboto@500"
    id: font_grande
    size: 72
    glyphs: "0123456789:.,-+°%CmhPa "
  - file: "gfonts://Roboto@300"
    id: font_orologio
    size: 180
    glyphs: "0123456789:-"

# --- Impostazioni comuni a tutte le pagine ----------------------------------
number:
  - platform: template
    id: spegnimento_schermo
    name: "Spegnimento schermo dopo"
    icon: mdi:timer-sand
    unit_of_measurement: s
    min_value: 0
    max_value: 3600
    step: 10
    initial_value: 120
    optimistic: true
    restore_value: true
    entity_category: config

text:
  # Scrivi qui (da browser, Home Assistant, MQTT o da un'altra pagina) e il
  # testo compare in un riquadro sopra qualunque pagina, riaccendendo lo
  # schermo. Utile per avvisi: campanello, lavatrice finita, timer...
  - platform: template
    id: messaggio
    name: "Messaggio"
    icon: mdi:message-alert
    mode: text
    max_length: 200
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: "return !x.empty();"
          then:
            - lvgl.label.update:
                id: msg_testo
                text: !lambda "return x;"
            - lvgl.widget.show: msg_box
            - script.execute: sveglia_schermo

script:
  - id: sveglia_schermo
    then:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - light.turn_on: backlight

  - id: aggiorna_orologio
    then:
      - lvgl.label.update:
          id: nav_ora
          text: !lambda |-
            auto t = id(orologio).now();
            if (!t.is_valid()) return std::string("--:--");
            return t.strftime("%H:%M");

touchscreen:
  - id: !extend touch
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - script.execute: sveglia_schermo

# --- Interfaccia grafica -----------------------------------------------------
lvgl:
  displays: [lcd]
  touchscreens: [touch]
  buffer_size: 25%
  default_font: font_testo
  page_wrap: true
  bg_color: 0x101418
  text_color: 0xFFFFFF
  style_definitions:
    - id: st_titolo
      text_font: font_titolo
      text_color: 0x8AB4F8
    - id: st_riquadro
      bg_color: 0x1C232B
      bg_opa: COVER
      border_width: 0
      radius: 16
      pad_all: 16
  theme:
    button:
      bg_color: 0x2A3440
      radius: 14
      text_color: 0xFFFFFF
      checked:
        bg_color: 0x1E88E5
    slider:
      indicator:
        bg_color: 0x1E88E5
      knob:
        bg_color: 0xFFFFFF
    switch:
      indicator:
        checked:
          bg_color: 0x1E88E5

  # schermo spento dopo N secondi senza tocchi (0 = mai); un tocco lo
  # riaccende senza attivare il pulsante sotto il dito
  on_idle:
    timeout: !lambda |-
      float s = id(spegnimento_schermo).state;
      return (s > 0 ? s : 86400) * 1000;
    then:
      - if:
          condition:
            lambda: "return id(spegnimento_schermo).state > 0;"
          then:
            - light.turn_off: backlight
            - lvgl.pause:

  # Barra di navigazione fissa in basso + riquadro messaggi: stanno nel
  # "top layer", quindi restano visibili su ogni pagina. Le pagine
  # occupano l'area sopra la barra (480 - 64 = 416 px di altezza utile).
  top_layer:
    widgets:
      - obj:
          id: nav_bar
          align: BOTTOM_MID
          width: 100%
          height: 64
          radius: 0
          bg_color: 0x0A0D10
          border_width: 0
          pad_all: 6
          widgets:
            - label:
                id: nav_ora
                align: LEFT_MID
                x: 12
                text: "--:--"
                text_font: font_titolo
            - button:
                align: CENTER
                x: -150
                width: 120
                height: 50
                on_click:
                  - lvgl.page.previous:
                widgets:
                  - label:
                      align: CENTER
                      text: ""
                      text_font: montserrat_28
            - button:
                align: CENTER
                width: 120
                height: 50
                on_click:
                  - lvgl.page.show: page_home
                widgets:
                  - label:
                      align: CENTER
                      text: ""
                      text_font: montserrat_28
            - button:
                align: CENTER
                x: 150
                width: 120
                height: 50
                on_click:
                  - lvgl.page.next:
                widgets:
                  - label:
                      align: CENTER
                      text: ""
                      text_font: montserrat_28
            - label:
                id: nav_wifi
                align: RIGHT_MID
                x: -12
                text: ""
                text_font: montserrat_28
                text_color: 0x555555

      - obj:
          id: msg_box
          hidden: true
          align: CENTER
          y: -32
          width: 640
          height: 300
          bg_color: 0x263238
          border_color: 0xFFB300
          border_width: 3
          radius: 20
          pad_all: 20
          widgets:
            - label:
                align: TOP_LEFT
                text: "Messaggio"
                styles: st_titolo
                text_color: 0xFFB300
            - label:
                id: msg_testo
                align: LEFT_MID
                width: 100%
                long_mode: WRAP
                text: ""
            - button:
                align: BOTTOM_RIGHT
                width: 160
                height: 56
                on_click:
                  - lvgl.widget.hide: msg_box
                  - text.set:
                      id: messaggio
                      value: ""
                widgets:
                  - label:
                      align: CENTER
                      text: "OK"
