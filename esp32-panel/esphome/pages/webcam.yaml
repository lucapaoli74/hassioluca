# Pagina Webcam: immagini dalle webcam di montagna, una alla volta.
# ◀ ▶ in alto cambiano webcam, ⟳ ricarica. Mentre la pagina è aperta
# l'immagine si aggiorna da sola ogni 10 minuti; quando esci viene liberata
# la memoria.
#
# ELENCO WEBCAM — modifica solo qui. Formato "Nome|URL", uno per riga.
# L'URL deve puntare direttamente all'IMMAGINE (.jpg/.png), non alla pagina
# web del sito: apri la webcam nel browser, tasto destro sull'immagine →
# "Copia indirizzo immagine". Funzionano http e https; JPEG "progressivi"
# non sono supportati dal decoder dell'ESP32.
globals:
  - id: webcam_elenco
    type: std::vector<std::string>
    initial_value: |-
      {
        "Webcam 1|https://www.example.com/webcam1.jpg",
        "Webcam 2|https://www.example.com/webcam2.jpg",
      }
  - id: webcam_indice
    type: int
    restore_value: true
    initial_value: "0"
  - id: webcam_visibile
    type: bool
    initial_value: "false"

http_request:
  id: http_client
  timeout: 20s
  follow_redirects: true
  # usa i certificati delle CA pubbliche inclusi in ESP-IDF
  verify_ssl: true

image:
  - platform: online_image
    id: webcam_img
    url: "https://www.example.com/webcam.jpg"  # sostituito all'avvio dall'elenco
    format: AUTO
    type: RGB565
    # massimo spazio disponibile: l'immagine viene rimpicciolita mantenendo
    # le proporzioni (16:9 → 604x340)
    resize: 760x340
    update_interval: never
    on_download_finished:
      - lvgl.image.update:
          id: webcam_widget
          src: webcam_img
      - lvgl.widget.hide: webcam_stato
      - lvgl.label.update:
          id: webcam_ora
          text: !lambda |-
            auto t = id(orologio).now();
            return t.is_valid() ? t.strftime("agg. %H:%M") : std::string("");
    on_error:
      - lvgl.label.update:
          id: webcam_stato
          text: "Immagine non disponibile (URL, rete o formato)"
      - lvgl.widget.show: webcam_stato

script:
  - id: webcam_carica
    mode: restart
    then:
      - lambda: |-
          int n = id(webcam_elenco).size();
          if (n == 0) return;
          id(webcam_indice) = ((id(webcam_indice) % n) + n) % n;
      - lvgl.label.update:
          id: webcam_nome
          text: !lambda |-
            if (id(webcam_elenco).empty()) return std::string("Nessuna webcam");
            const std::string &e = id(webcam_elenco)[id(webcam_indice)];
            char buf[16];
            snprintf(buf, sizeof(buf), "  %d/%d", id(webcam_indice) + 1,
                     (int) id(webcam_elenco).size());
            return e.substr(0, e.find('|')) + buf;
      - lvgl.label.update:
          id: webcam_stato
          text: "Caricamento..."
      - lvgl.widget.show: webcam_stato
      - if:
          condition:
            lambda: "return !id(webcam_elenco).empty();"
          then:
            - online_image.set_url:
                id: webcam_img
                url: !lambda |-
                  const std::string &e = id(webcam_elenco)[id(webcam_indice)];
                  size_t p = e.find('|');
                  return p == std::string::npos ? e : e.substr(p + 1);

interval:
  - interval: 10min
    then:
      - if:
          condition:
            lambda: "return id(webcam_visibile);"
          then:
            - script.execute: webcam_carica

lvgl:
  pages:
    - id: page_webcam
      on_load:
        - lambda: "id(webcam_visibile) = true;"
        - script.execute: webcam_carica
      on_unload:
        - lambda: "id(webcam_visibile) = false;"
        - online_image.release: webcam_img
      widgets:
        - label:
            id: webcam_nome
            align: TOP_LEFT
            x: 24
            y: 16
            width: 420
            long_mode: DOT
            text: "Webcam"
            styles: st_titolo
        - label:
            id: webcam_ora
            align: TOP_LEFT
            x: 450
            y: 26
            text: ""
            text_color: 0x78909C
        - button:
            align: TOP_RIGHT
            x: -196
            y: 8
            width: 80
            height: 50
            on_click:
              - lambda: "id(webcam_indice) -= 1;"
              - script.execute: webcam_carica
            widgets:
              - label: { align: CENTER, text: "", text_font: montserrat_28 }
        - button:
            align: TOP_RIGHT
            x: -106
            y: 8
            width: 80
            height: 50
            on_click:
              - script.execute: webcam_carica
            widgets:
              - label: { align: CENTER, text: "", text_font: montserrat_28 }
        - button:
            align: TOP_RIGHT
            x: -16
            y: 8
            width: 80
            height: 50
            on_click:
              - lambda: "id(webcam_indice) += 1;"
              - script.execute: webcam_carica
            widgets:
              - label: { align: CENTER, text: "", text_font: montserrat_28 }
        - image:
            id: webcam_widget
            align: TOP_MID
            y: 70
            src: webcam_img
        - label:
            id: webcam_stato
            align: TOP_MID
            y: 220
            text: "Caricamento..."
            text_color: 0x90A4AE
