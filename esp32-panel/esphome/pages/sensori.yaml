# Pagina Sensori: misure locali. Funziona anche senza sensori esterni
# (temperatura del chip, segnale WiFi, tempo di accensione); se colleghi un
# BME280 al connettore I2C compaiono anche temperatura, umidità e pressione
# ambiente. Senza BME280 quei riquadri mostrano "--" e il log segnala solo
# che il sensore manca.
sensor:
  - platform: bme280_i2c
    i2c_id: bus_i2c
    address: 0x76  # 0x77 su alcuni moduli: controlla la scansione I2C nel log
    update_interval: 30s
    temperature:
      name: "Temperatura ambiente"
      id: amb_temp
      on_value:
        - lvgl.label.update:
            id: lbl_temp
            text: !lambda 'return str_sprintf("%.1f°C", x);'
    humidity:
      name: "Umidità ambiente"
      id: amb_umid
      on_value:
        - lvgl.label.update:
            id: lbl_umid
            text: !lambda 'return str_sprintf("%.0f%%", x);'
    pressure:
      name: "Pressione"
      id: amb_press
      on_value:
        - lvgl.label.update:
            id: lbl_press
            text: !lambda 'return str_sprintf("%.0f hPa", x);'

  - platform: internal_temperature
    name: "Temperatura chip"
    update_interval: 30s
    on_value:
      - lvgl.label.update:
          id: lbl_chip
          text: !lambda 'return str_sprintf("%.0f°C", x);'

  - platform: wifi_signal
    name: "Segnale WiFi"
    update_interval: 30s
    on_value:
      - lvgl.label.update:
          id: lbl_wifi
          text: !lambda 'return str_sprintf("%.0f dBm", x);'

  - platform: uptime
    name: "Acceso da"
    update_interval: 60s
    on_value:
      - lvgl.label.update:
          id: lbl_uptime
          text: !lambda |-
            int m = (int) x / 60;
            return str_sprintf("%dg %dh %dm", m / 1440, (m / 60) % 24, m % 60);

lvgl:
  pages:
    - id: page_sensori
      widgets:
        - label:
            align: TOP_LEFT
            x: 24
            y: 16
            text: "Sensori"
            styles: st_titolo
        - obj:
            align: TOP_MID
            y: 70
            width: 760
            height: 330
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: ROW_WRAP
              flex_align_main: START
              pad_row: 18
              pad_column: 18
            widgets:
              # riquadri: titolo piccolo in alto, valore grande in basso
              - obj:
                  styles: st_riquadro
                  width: 241
                  height: 156
                  widgets:
                    - label: { align: TOP_LEFT, text: "Temperatura", text_color: 0x90A4AE }
                    - label: { id: lbl_temp, align: BOTTOM_LEFT, text: "--", text_font: font_grande }
              - obj:
                  styles: st_riquadro
                  width: 241
                  height: 156
                  widgets:
                    - label: { align: TOP_LEFT, text: "Umidità", text_color: 0x90A4AE }
                    - label: { id: lbl_umid, align: BOTTOM_LEFT, text: "--", text_font: font_grande }
              - obj:
                  styles: st_riquadro
                  width: 241
                  height: 156
                  widgets:
                    - label: { align: TOP_LEFT, text: "Pressione", text_color: 0x90A4AE }
                    - label: { id: lbl_press, align: BOTTOM_LEFT, text: "--", styles: st_titolo, text_color: 0xFFFFFF }
              - obj:
                  styles: st_riquadro
                  width: 241
                  height: 156
                  widgets:
                    - label: { align: TOP_LEFT, text: "Chip ESP32", text_color: 0x90A4AE }
                    - label: { id: lbl_chip, align: BOTTOM_LEFT, text: "--", styles: st_titolo, text_color: 0xFFFFFF }
              - obj:
                  styles: st_riquadro
                  width: 241
                  height: 156
                  widgets:
                    - label: { align: TOP_LEFT, text: "Segnale WiFi", text_color: 0x90A4AE }
                    - label: { id: lbl_wifi, align: BOTTOM_LEFT, text: "--", styles: st_titolo, text_color: 0xFFFFFF }
              - obj:
                  styles: st_riquadro
                  width: 241
                  height: 156
                  widgets:
                    - label: { align: TOP_LEFT, text: "Acceso da", text_color: 0x90A4AE }
                    - label: { id: lbl_uptime, align: BOTTOM_LEFT, text: "--", styles: st_titolo, text_color: 0xFFFFFF }
