# Webcam Manager: test a ogni modifica; con un tag "webcam-manager-vX.Y.Z"
# crea la release con eseguibili, Setup.exe e latest.json. Le installazioni
# con gli aggiornamenti da GitHub attivi la installano da sole.
name: webcam-manager

on:
  push:
    paths: ["webcam-manager/**", ".github/workflows/webcam-manager.yml"]
    tags: ["webcam-manager-v*"]
  pull_request:
    paths: ["webcam-manager/**"]

permissions:
  contents: write

defaults:
  run:
    working-directory: webcam-manager

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: webcam-manager/go.mod
          cache-dependency-path: webcam-manager/go.sum
      - run: go vet ./... && GOOS=windows go vet ./...
      - run: go test -race ./...

  release:
    if: startsWith(github.ref, 'refs/tags/webcam-manager-v')
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: webcam-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: webcam-manager/go.mod
          cache-dependency-path: webcam-manager/go.sum
      - name: Versione
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#webcam-manager-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # note di rilascio: la sezione della versione nel CHANGELOG
          awk -v v="$VERSION" '$0 ~ "^## \\[?"v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.txt
      - name: Compila tutte le piattaforme
        run: ./build.sh "${{ steps.v.outputs.version }}" "$(cat notes.txt)"
      - name: ffmpeg per Windows (telecamere RTSP)
        run: |
          curl -fsSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
          unzip -q ff.zip
          mkdir -p installer/files
          cp ffmpeg-*/bin/ffmpeg.exe installer/files/
          cp dist/webcam-manager-windows-amd64.exe installer/files/webcam-manager.exe
      - name: Setup.exe (Inno Setup)
        shell: pwsh
        working-directory: webcam-manager
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" installer\webcam-manager.iss
      - uses: softprops/action-gh-release@v2
        with:
          name: Webcam Manager ${{ steps.v.outputs.version }}
          body_path: webcam-manager/notes.txt
          make_latest: true
          files: webcam-manager/dist/*
