# ESPHome firmware for the loose-cigarette roller dispenser.
# Flash with: esphome run cigarette-dispenser.yaml
# Secrets (wifi_ssid, wifi_password, api_encryption_key, ota_password) live
# in secrets.yaml (see secrets.yaml.example) — never commit real secrets.
#
# Design: the daily quota and today's count are enforced HERE, on the
# device, not in Home Assistant. The front button, the HA dashboard button
# and the Android app all end up calling the same `try_dispense` script, so
# the same rule applies no matter who presses what — and the button keeps
# working (respecting the quota) even if WiFi/HA is briefly down.

esphome:
  name: cigarette-dispenser
  friendly_name: Distributore Sigarette
  min_version: 2024.6.0

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key
  services:
    # remote "dispense one" for the HA dashboard / Android app — goes
    # through the exact same quota check as the physical button
    - service: dispense_one
      then:
        - script.execute: try_dispense
    - service: lock_hopper
      then:
        - switch.turn_on: hopper_lock
    - service: unlock_hopper
      then:
        - switch.turn_off: hopper_lock

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Cigarette-Dispenser Fallback"
    password: !secret ota_password

captive_portal:

# orologio locale per il reset giornaliero della quota — funziona anche
# offline dopo la prima sincronizzazione (l'RTC interno dell'ESP32 deriva
# un po' senza rete, accettabile per un reset "a mezzanotte" domestico)
time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Rome"
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              id(dispensed_today) = 0;
          - logger.log: "Reset quota giornaliera (mezzanotte)"

# --- Motion: rullo scanalato su NEMA17 tramite A4988/DRV8825 ---------------
stepper:
  - platform: a4988
    id: roller_stepper
    step_pin: GPIO25
    dir_pin: GPIO26
    sleep_pin: GPIO27
    max_speed: 300 steps/s
    acceleration: 600 steps/s^2
    deceleration: 600 steps/s^2

globals:
  # passi per un giro completo del rullo: passi interi motore * microstep *
  # eventuale rapporto di riduzione — calibra per il tuo motore/accoppiamento
  - id: steps_per_rev
    type: int
    restore_value: false
    initial_value: "3200"
  # numero di scanalature del rullo stampato — deve combaciare con `flutes`
  # in hardware/3d-print/params.scad
  - id: flute_count
    type: int
    restore_value: false
    initial_value: "8"
  - id: dispensed_today
    type: int
    restore_value: true
    initial_value: "0"

# --- Policy: quota giornaliera + scorta stimata, impostabili da remoto ----
number:
  - platform: template
    name: "Quota giornaliera"
    id: daily_quota
    icon: mdi:counter
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    name: "Scorta stimata"
    id: stock_estimate
    icon: mdi:cigar
    min_value: 0
    max_value: 300
    step: 1
    initial_value: 100
    optimistic: true
    restore_value: true

sensor:
  - platform: template
    name: "Erogate oggi"
    id: dispensed_today_sensor
    icon: mdi:cigar-off
    lambda: "return id(dispensed_today);"
    update_interval: 10s
    accuracy_decimals: 0
    state_class: total_increasing

# --- Sensori -----------------------------------------------------------------
binary_sensor:
  - platform: gpio
    name: "Pulsante erogazione"
    id: dispense_button
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - script.execute: try_dispense

  - platform: gpio
    name: "Caduta sigaretta confermata"
    id: drop_sensor
    pin:
      # GPIO34 è input-only, senza pullup interno: pull-up esterno da 10k
      # (vedi hardware/wiring.md)
      number: GPIO34
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 10ms

switch:
  - platform: gpio
    name: "Serratura tramoggia"
    id: hopper_lock
    pin: GPIO14
    restore_mode: ALWAYS_OFF

output:
  - platform: ledc
    id: buzzer_out
    pin: GPIO32
  - platform: ledc
    id: status_led_out
    pin: GPIO33

light:
  - platform: monochromatic
    name: "LED di stato"
    id: status_led
    output: status_led_out

# --- Logica di erogazione --------------------------------------------------
script:
  - id: try_dispense
    mode: single
    then:
      - if:
          condition:
            lambda: "return id(dispensed_today) < (int) id(daily_quota).state;"
          then:
            - script.execute: do_dispense_one
          else:
            - output.set_level: { id: buzzer_out, level: 80% }
            - delay: 150ms
            - output.set_level: { id: buzzer_out, level: 0% }
            - delay: 100ms
            - output.set_level: { id: buzzer_out, level: 80% }
            - delay: 150ms
            - output.set_level: { id: buzzer_out, level: 0% }
            - homeassistant.event:
                event: esphome.quota_reached
                data: {}

  - id: do_dispense_one
    mode: single
    then:
      - lambda: |-
          int steps = id(steps_per_rev) / id(flute_count);
          id(roller_stepper).set_target(id(roller_stepper).current_position + steps);
      - wait_until:
          condition:
            lambda: "return id(roller_stepper).current_position == id(roller_stepper).target_position;"
          timeout: 10s
      - wait_until:
          condition:
            binary_sensor.is_on: drop_sensor
          timeout: 3s
      - if:
          condition:
            binary_sensor.is_on: drop_sensor
          then:
            - lambda: |-
                id(dispensed_today) += 1;
                float remaining = id(stock_estimate).state - 1;
                if (remaining < 0) remaining = 0;
                id(stock_estimate).make_call().set_value(remaining).perform();
            - output.set_level: { id: buzzer_out, level: 50% }
            - delay: 80ms
            - output.set_level: { id: buzzer_out, level: 0% }
            - homeassistant.event:
                event: esphome.dispense_confirmed
                data: {}
          else:
            - output.set_level: { id: buzzer_out, level: 100% }
            - delay: 500ms
            - output.set_level: { id: buzzer_out, level: 0% }
            - homeassistant.event:
                event: esphome.dispense_failed
                data: {}
