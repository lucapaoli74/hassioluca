# Vista Lovelace — importa come "nuova vista" (modalità YAML) o incolla il
# contenuto sotto `views:` nella tua dashboard esistente. Solo card stock,
# nessuna HACS necessaria. Compatibile anche con l'app Android Home
# Assistant Companion (vedi ../../README.md per come attivarla).
#
# NOTA: gli entity_id generati dall'integrazione ESPHome dipendono dalla
# tua versione di Home Assistant/ESPHome (potrebbero essere prefissati col
# nome del dispositivo, es. number.distributore_sigarette_quota_giornaliera).
# Controlla in Impostazioni → Dispositivi e servizi → cigarette-dispenser i
# nomi reali e correggi le righe sotto se necessario.

title: Distributore Sigarette
path: distributore-sigarette
icon: mdi:cigar
cards:
  - type: entities
    title: Stato
    entities:
      - entity: sensor.erogate_oggi
        name: Erogate oggi
      - entity: number.quota_giornaliera
        name: Quota giornaliera (politica)
      - entity: number.scorta_stimata
        name: Scorta stimata
      - entity: binary_sensor.scorta_sigarette_in_esaurimento
        name: Scorta in esaurimento

  - type: button
    name: Eroga una sigaretta
    icon: mdi:cigar
    show_state: false
    tap_action:
      action: call-service
      service: esphome.cigarette_dispenser_dispense_one
      confirmation:
        text: Erogare una sigaretta?

  - type: entities
    title: Tramoggia
    entities:
      - entity: switch.serratura_tramoggia
        name: Serratura tramoggia (per la ricarica)
      - type: divider
      - entity: number.scorta_stimata
        name: "Imposta scorta dopo la ricarica (es. 100)"

  - type: history-graph
    title: Erogazioni — ultimi 7 giorni
    hours_to_show: 168
    entities:
      - sensor.erogate_oggi
