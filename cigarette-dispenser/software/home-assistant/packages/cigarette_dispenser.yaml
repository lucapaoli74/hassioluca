# Home Assistant package — gestione remota del distributore.
#
# Con il nuovo meccanismo (sigarette sfuse + rullo), la quota giornaliera e
# il conteggio erogazioni vivono SUL dispositivo ESPHome (number.*/sensor.*
# esposti automaticamente): questo pacchetto è solo l'interfaccia — non
# duplica lo stato, così pulsante fisico, dashboard e app Android vedono
# sempre lo stesso numero.
#
# Installazione: abilita i pacchetti in configuration.yaml
#   homeassistant:
#     packages: !include_dir_named packages
# poi copia questo file in <config>/packages/cigarette_dispenser.yaml
# e aggiungi il dispositivo ESPHome (Impostazioni → Dispositivi e servizi →
# aggiungi integrazione → ESPHome → cigarette-dispenser.local).
#
# NOTA: gli entity_id esatti (number.quota_giornaliera, number.scorta_stimata,
# sensor.erogate_oggi, ecc.) dipendono dalla tua versione Home Assistant/
# ESPHome, che potrebbe prefissarli col nome del dispositivo. Controlla in
# Impostazioni → Dispositivi e servizi → cigarette-dispenser e correggi le
# righe sotto se necessario.

template:
  - binary_sensor:
      - name: "Scorta sigarette in esaurimento"
        unique_id: cig_low_stock
        icon: mdi:alert
        state: "{{ states('number.scorta_stimata') | int(999) < 15 }}"

automation:
  - alias: "Distributore: erogazione confermata"
    trigger:
      - platform: event
        event_type: esphome.dispense_confirmed
    action:
      - service: persistent_notification.create
        data:
          title: "Distributore sigarette"
          message: >
            Sigaretta erogata. Oggi: {{ states('sensor.erogate_oggi') }}/{{ states('number.quota_giornaliera') }}.
            Scorta stimata: {{ states('number.scorta_stimata') }}.

  - alias: "Distributore: erogazione fallita"
    trigger:
      - platform: event
        event_type: esphome.dispense_failed
    action:
      - service: persistent_notification.create
        data:
          title: "Distributore sigarette — attenzione"
          message: >
            Erogazione non confermata dal sensore di caduta: possibile
            inceppamento o tramoggia vuota. Controlla la macchina.

  - alias: "Distributore: quota giornaliera raggiunta"
    trigger:
      - platform: event
        event_type: esphome.quota_reached
    action:
      - service: persistent_notification.create
        data:
          title: "Distributore sigarette"
          message: >
            Quota giornaliera raggiunta ({{ states('number.quota_giornaliera') }}).
            Nessuna erogazione fino a mezzanotte.

  - alias: "Distributore: scorta in esaurimento"
    trigger:
      - platform: state
        entity_id: binary_sensor.scorta_sigarette_in_esaurimento
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "Distributore sigarette"
          message: >
            Scorta stimata sotto le 15 sigarette: ricarica la tramoggia
            e aggiorna "Scorta stimata" nel pannello dopo averlo fatto.

  - alias: "Distributore: erogazione bloccata, tramoggia aperta"
    trigger:
      - platform: event
        event_type: esphome.hopper_open_blocked
    action:
      - service: persistent_notification.create
        data:
          title: "Distributore sigarette — sicurezza"
          message: >
            Pulsante premuto ma la tramoggia risulta aperta: il rullo NON si
            è mosso (interblocco di sicurezza). Chiudi e blocca lo sportello
            per riprendere a erogare.

  - alias: "Distributore: tramoggia rimasta aperta"
    trigger:
      - platform: state
        entity_id: binary_sensor.tramoggia_chiusa
        to: "off"
        for: "00:05:00"
    action:
      - service: persistent_notification.create
        data:
          title: "Distributore sigarette"
          message: >
            La tramoggia è aperta da più di 5 minuti. Se hai finito di
            ricaricare, chiudi e blocca lo sportello.
